<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Email Marketing Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-xl font-bold text-gray-900">Email Marketing Platform</h1>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 px-4">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900">{{ title }}</h2>
        </div>

        <div class="bg-white shadow rounded-lg p-6">
            <p class="text-gray-600">Welcome to the Email Marketing Platform!</p>
            <p class="text-sm text-gray-500 mt-2">This is a Django-based email marketing system with Mailgun and Odoo integration.</p>
        </div>
    </main>
</body>
</html>
